# Pinned environment: python 3.8.5, pytorch 1.12.1 + cudatoolkit 11.3.
#   conda env create -f env/environment.yml && conda activate continuitycam
#   mkdir -p $CONDA_PREFIX/etc/conda/activate.d && cp env/activate_cuda_path.sh $CONDA_PREFIX/etc/conda/activate.d/
name: continuitycam
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.8.5
  - pip=20.3
  - cudatoolkit=11.3
  - pytorch=1.12.1
  - torchvision=0.13.1
  - numpy=1.23.1
  - pip:
      - -r requirements.txt
